# 비밀값(DATABASE_URL, JWT_SECRET_KEY, GEMINI_API_KEY, GITHUB_TOKEN)은 절대 여기 넣지 않는다.
# 이 파일은 git에 커밋되므로, 비밀값은 지금처럼 backend/.env(로컬)와 EC2 .env(배포)에만 둔다.
#
# 여기 두는 건 "재배포 없이 조정하고 싶은, 비밀이 아닌 튜닝값"이다.
# 우선순위: 환경변수 > 이 파일 > 코드 기본값 (config/settings.py 참고)

app:
  port: 8080

auth:
  jwt_expire_minutes: 10080  # 7일. JWT_EXPIRE_MINUTES 환경변수로 덮어쓸 수 있음.
  email_verify_code_expire_minutes: 10  # 이메일 인증 6자리 코드 만료시간(분).
                                          # EMAIL_VERIFY_CODE_EXPIRE_MINUTES 환경변수로 덮어쓸 수 있음.
                                          # (2026-08-24, 딥링크 방식에서 전환하며 추가).
  password_reset_code_expire_minutes: 10  # 비밀번호 재설정 6자리 코드 만료시간(분).
                                            # PASSWORD_RESET_CODE_EXPIRE_MINUTES 환경변수로 덮어쓸 수 있음.
                                            # (2026-08-27 추가)

# ---------------------------------------------------------------------------
# C파트(은우) 소관 설정값. 2026-08-27 은우 승인 후 이관 완료
# (models/layer3.py, models/xai.py, pipeline/monitor.py에서 os.environ.get(...)
# 직접 읽던 것을 config.settings.get()으로 교체). 값 자체나 기본값을 바꾸는 게
# 아니라 "어디서 관리하느냐"만 바꾼 것 — 여전히 환경변수로 덮어쓸 수 있음
# (예: 운영에서 급하게 재시작만으로 조정하고 싶을 때는 지금처럼 EC2 .env에
# 같은 이름의 환경변수를 넣으면 이 파일 값보다 우선함).
model:
  xai_steps: 32              # CANARY_XAI_STEPS 환경변수로 덮어쓸 수 있음
  repo: Cloud9-capstone-2026/cloud9   # CANARY_MODEL_REPO 환경변수로 덮어쓸 수 있음
  dist_trigger: 2             # CANARY_DIST_TRIGGER 환경변수로 덮어쓸 수 있음.
                               # 분포 점검 발동 기준(이탈 지표 개수) — 실사용
                               # 데이터 쌓이면 조정 예정(은우, pipeline/monitor.py)