# 비밀값(DATABASE_URL, JWT_SECRET_KEY, GEMINI_API_KEY, GITHUB_TOKEN)은 절대 여기 넣지 않는다.
# 이 파일은 git에 커밋되므로, 비밀값은 지금처럼 backend/.env(로컬)와 EC2 .env(배포)에만 둔다.
#
# 여기 두는 건 "재배포 없이 조정하고 싶은, 비밀이 아닌 튜닝값"이다.
# 우선순위: 환경변수 > 이 파일 > 코드 기본값 (config/settings.py 참고)

app:
  port: 8080

auth:
  jwt_expire_minutes: 10080  # 7일. JWT_EXPIRE_MINUTES 환경변수로 덮어쓸 수 있음.
  email_verify_code_expire_minutes: 10  # 이메일 인증 6자리 코드 만료시간(분).
                                          # EMAIL_VERIFY_CODE_EXPIRE_MINUTES 환경변수로 덮어쓸 수 있음.
                                          # (2026-08-24, 딥링크 방식에서 전환하며 추가).

# ---------------------------------------------------------------------------
# 아래는 현재 models/layer3.py, models/xai.py, pipeline/monitor.py에
# os.environ.get(...)으로 흩어져 있는 C파트 소관 설정값들이다.
# settings.yaml 인프라(config/settings.py)는 이미 마련해뒀으니, 실제로 이
# 파일로 옮길지는 은우와 협의 후 결정 — 나림이 임의로 C파트 파일을 고치지
# 않기 위해 주석 처리 상태로 남겨둔다.
#
# model:
#   xai_steps: 32              # 현재 CANARY_XAI_STEPS
#   repo: Cloud9-capstone-2026/cloud9   # 현재 CANARY_MODEL_REPO