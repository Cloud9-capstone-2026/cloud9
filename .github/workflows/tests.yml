# 자동 테스트 — PR 생성·갱신 시와 main push 시 빠른 층 테스트를 실행한다.
# 느린 층(-m slow)은 로컬 데이터(시세 캐시·데이터셋)가 필요해 CI에서는 제외
# (해당 테스트들은 데이터 없는 환경에서 자동 skip 되도록 작성돼 있음).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 의존성 설치 (lock 고정 버전)
        run: pip install -r requirements.lock

      - name: 빠른 층 테스트
        run: pytest -q
